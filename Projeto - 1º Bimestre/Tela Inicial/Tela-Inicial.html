<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paginar</title>

    <link rel="stylesheet" href="Tela-Inicial.css">
</head>
<body>
<!-- Logo com as opções  -->
  <header>
    <div class="logo"><img src="/PSI/Projeto - 1º Bimestre/Imagens/Logo-Oficial.png" alt=""></div>
    <nav class="navbar">
      <a href="#">Categorias</a>
      <a href="#">Sobre</a>
    </nav>
  </header>

  <div>
    <span>É novo por aqui? Cadastre-se agora, ou recupere seu login!</span>
    <button>Cadastre-se</button>
    <button>Login</button>
  </div>

  <section class="banner">
    <h1>Bem-vindo à Paginar</h1>
    <p>Descubra livros incríveis e viva novas histórias</p>
    <button>Ver Livros</button>
  </section>

  <section class="categorias">
    <h2>Categorias</h2>
    <div class="grid-categorias">
      <div>Romance</div>
      <div>Ficção</div>
      <div>Técnico</div>
      <div>HQs</div>
    </div>
  </section>

  <section class="destaques">
    <h2>Livros em Destaque</h2>
    <div class="grid-livros">
      <div class="livro">
        <img src="https://placehold.co/150x220" alt="Capa do Livro">
        <h3>Título do Livro</h3>
        <p>R$ 39,90</p>
      </div>
      <!-- repetir com outros livros -->
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Paginar - Marketplace de Livros</p>
  </footer>

</body>
</html>
