<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compra - Paginar</title>
  <link rel="stylesheet" href="Tela-Compra.css">
</head>
<body>

  <div class="container">
    <h1>Finalizar Compra</h1>
    <form action="#" method="post">
      
      <label for="livro">Livro Selecionado</label>
      <input type="text" id="livro" name="livro" value="Trabalho e Afeto" readonly>

      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="pagamento">Forma de Pagamento</label>
      <select id="pagamento" name="pagamento" required>
        <option value="">Selecione</option>
        <option value="pix">Pix</option>
        <option value="cartao">Cartão de Crédito</option>
        <option value="boleto">Boleto</option>
      </select>

      <label for="valor">Valor</label>
      <input type="text" id="valor" name="valor" value="R$ 19,90" readonly>

      <button type="submit">Confirmar Compra</button>
    </form>
  </div>

</body>
</html>
